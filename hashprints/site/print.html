<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.png">
<title>HashPrint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f4f0e6; --paper-2: #ebe5d6; --ink: #1b1b1b; --muted: #7a7466; --rule: #d6cfbd; --accent: #ff48b0; --gold: #b38b14; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #0b0b10; --paper-2: #13131b; --ink: #f0efec; --muted: #8b8a9c; --rule: #2a2a38; --accent: #c6ff00; --gold: #ffd700; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #0b0b10; --paper-2: #13131b; --ink: #f0efec; --muted: #8b8a9c; --rule: #2a2a38; --accent: #c6ff00; --gold: #ffd700; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 "Space Grotesk", system-ui, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--accent); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; font: 700 16px "JetBrains Mono", monospace; }
  .top span { color: var(--accent); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; gap: 24px; } }
  .frame { background: var(--paper-2); border: 1px solid var(--rule); padding: 14px; }
  canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; }
  h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1; margin: 0 0 8px; letter-spacing: -1px; }
  .sub { color: var(--muted); font: 13px "JetBrains Mono", monospace; word-break: break-all; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font: 13px "JetBrains Mono", monospace; margin-bottom: 24px; }
  th, td { text-align: left; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: 400; width: 40%; }
  td { text-align: right; }
  .gold { color: var(--gold); font-weight: 700; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn { font: 700 13px "JetBrains Mono", monospace; padding: 10px 16px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; }
  button:hover, .btn:hover { background: var(--ink); color: var(--paper); }
  .err { border-left: 4px solid var(--accent); padding: 12px 16px; background: var(--paper-2); }
  .top nav { display: flex; gap: 18px; }
  h2 { font: 700 13px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 6px; }
  td a { text-decoration-color: var(--accent); }
  .hist td:first-child { text-align: left; }
  .trade { border: 2px solid var(--ink); padding: 16px; margin: 0 0 24px; }
  .trade .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .trade .lbl { font: 12px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .trade .price { font: 700 28px "JetBrains Mono", monospace; }
  .trade .sub { font: 12px "JetBrains Mono", monospace; color: var(--muted); margin: 4px 0 14px; word-break: normal; }
  .trade .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .trade .acts button { flex: 1 1 160px; }
  .trade button.primary { background: var(--ink); color: var(--paper); }
  .trade button.primary:hover { background: var(--accent); border-color: var(--accent); color: #000; }
  .trade button:disabled { opacity: .45; cursor: not-allowed; }
  .trade form { margin-top: 14px; display: grid; gap: 10px; }
  .trade label { font: 11px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); display: grid; gap: 6px; }
  .trade input, .trade select { font: 15px "JetBrains Mono", monospace; padding: 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); width: 100%; }
  .trade .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .trade .split { font: 12px "JetBrains Mono", monospace; color: var(--ink-2, var(--muted)); line-height: 1.7; }
  .trade .msg { font: 13px "JetBrains Mono", monospace; margin-top: 12px; min-height: 1.2em; word-break: break-word; }
  .trade .msg.bad { color: #c62828; }
  .trade .msg.good { color: #00835a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/" style="text-decoration:none">HASH<span>/</span>PRINTS</a><nav><a href="collection.html" id="navCollection">Collection</a><a href="mint.html" id="navMint">Mint →</a></nav></div>
  <div id="view"></div>
</div>
<script src="vendor/ethers-6.umd.min.js"></script>
<script src="wallet.js"></script>
<script src="market-core.js"></script>
<script src="market.js"></script>
<script src="hashprints.js"></script>
<script>
  (async function () {
    const HP = window.HashPrints;
    const q = new URLSearchParams(location.search);
    const id = Number(q.get('id'));
    let seed = (q.get('seed') || '').toLowerCase();
    let d = Number(q.get('d') || 16);
    const key = q.get('c') === 'test' ? 'test' : 'main';
    const shape = HP.COLLECTIONS[key];
    const withC = (path) => (key === 'test' ? path + (path.includes('?') ? '&' : '?') + 'c=test' : path);
    document.getElementById('navCollection').href = withC('collection.html');
    document.getElementById('navMint').href = withC('mint.html');
    const view = document.getElementById('view');

    // Chain data for this token (owner, minter, history). The page still works without it.
    let chain = null;
    let token = null;
    if (Number.isInteger(id) && id > 0) {
      try {
        const r = await fetch(`/api/collection?c=${key}`);
        if (r.ok) chain = await r.json();
        token = chain?.tokens?.find((t) => t.id === id) || null;
      } catch {}
      if (token && !/^0x[0-9a-f]{64}$/.test(seed)) { seed = token.seed.toLowerCase(); d = token.d; }
    }

    if (!/^0x[0-9a-f]{64}$/.test(seed) || HP.leadingZeroBits(HP.fromHex(seed)) < d) {
      view.innerHTML = '<p class="err">This link doesn\'t point to a valid print. It needs a 64-character seed with enough zero bits.</p>';
      return;
    }
    const art = HP.render(seed, d);
    const title = id >= 1 && id <= shape.artistProofs ? `A/P ${id}` : id ? `#${id}` : '';
    const heading = `${shape.name} ${title}`.trim();
    document.title = heading;
    view.innerHTML = `
      <div class="grid">
        <div class="frame"><canvas id="c"></canvas></div>
        <div>
          <h1>${heading}</h1>
          <div class="sub">seed ${seed}</div>
          <div class="trade" id="trade" hidden></div>
          <table id="own" hidden></table>
          <h2>Traits</h2>
          <table id="t"></table>
          <div id="histWrap" hidden><h2>History</h2><table class="hist" id="hist"></table></div>
          <div class="btns"><button id="png" type="button">PNG</button><button id="svg" type="button">SVG</button><a class="btn" href="${withC('collection.html')}">Collection</a><a class="btn" href="/#art">About the art</a></div>
        </div>
      </div>`;
    const c = document.getElementById('c');
    c.width = c.height = art.size;
    const ctx = c.getContext('2d');
    art.grid.forEach((row, y) => row.forEach((v, x) => { ctx.fillStyle = art.palette[v]; ctx.fillRect(x, y, 1, 1); }));
    const rows = Object.entries(art.traits);
    if (id > shape.artistProofs) rows.push(['Run', Math.floor((id - shape.artistProofs - 1) / shape.runSize) + 1]);
    rows.push(['Difficulty', `${d} bits`]);
    const addRow = (table, k, v, cls) => {
      const tr = table.insertRow();
      const th = document.createElement('th');
      th.textContent = k;
      tr.appendChild(th);
      const td = tr.insertCell();
      if (v instanceof Node) td.appendChild(v); else td.textContent = v;
      if (cls) td.className = cls;
      return td;
    };
    const t = document.getElementById('t');
    for (const [k, v] of rows) addRow(t, k, v, k === 'Rarity' && v !== 'Common' ? 'gold' : '');

    // Owner, minter and history, when the token is on chain and matches this seed.
    if (token && token.seed.toLowerCase() === seed) {
      const short = (a) => `${a.slice(0, 6)}…${a.slice(-4)}`;
      const link = (text, href, external) => {
        const a = document.createElement('a');
        a.textContent = text;
        a.href = href;
        if (external) { a.target = '_blank'; a.rel = 'noopener'; }
        return a;
      };
      const wallet = (a) => link(short(a), withC(`collection.html?owner=${a}`));
      const when = (sec) => new Date(sec * 1000).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      const own = document.getElementById('own');
      own.hidden = false;
      addRow(own, 'Owner', wallet(token.owner));
      addRow(own, 'Minted by', wallet(token.minter));
      addRow(own, 'Minted', link(`${when(token.time)} ↗`, `${chain.explorer}/tx/${token.tx}`, true));
      addRow(own, 'Token', link(`${short(chain.address)} / ${id} ↗`, `${chain.explorer}/nft/${chain.address}/${id}`, true));
      const events = chain.activity.filter((a) => a.id === id);
      if (token.lastSale) addRow(own, 'Last sale', HPTrade.eth(token.lastSale.price));
      if (events.length > 1) {
        const hist = document.getElementById('hist');
        document.getElementById('histWrap').hidden = false;
        for (const ev of events) {
          const span = document.createElement('span');
          const priced = ev.kind === 'sale' ? `${HPTrade.eth(ev.price)}${ev.currency === 'WETH' ? ' (WETH)' : ''} · ` : '';
          span.append(priced, ev.kind === 'mint' ? 'Minted to ' : `${short(ev.from)} → `, wallet(ev.to), ' · ', link(when(ev.time), `${chain.explorer}/tx/${ev.tx}`, true));
          addRow(hist, ev.kind === 'mint' ? 'Mint' : ev.kind === 'sale' ? 'Sale' : 'Transfer', span);
        }
      }
      trade(token, chain).catch(() => {});
    }

    // ---------------------------------------------------------------- buy / sell
    async function trade(token, chain) {
      const box = document.getElementById('trade');
      let market;
      try { market = await HPTrade.load(key); } catch { return; }
      if (!market.enabled) return;
      await HPTrade.connect(market.chainId, true).catch(() => null);
      const same = (a, b) => !!a && !!b && a.toLowerCase() === b.toLowerCase();
      const short = (a) => `${a.slice(0, 6)}…${a.slice(-4)}`;
      const ends = (t) => new Date(t * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      let owner = token.owner;
      let busy = false;
      let selling = false;

      const el = (tag, attrs = {}, ...kids) => {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) if (k === 'class') n.className = v; else if (k.startsWith('on')) n[k] = v; else n.setAttribute(k, v);
        n.append(...kids.filter((k) => k !== null && k !== undefined));
        return n;
      };
      const msg = el('div', { class: 'msg', role: 'status' });
      const say = (text, kind = '') => { msg.textContent = text; msg.className = `msg ${kind}`; };

      async function act(fn, done) {
        if (busy) return;
        busy = true;
        render();
        try {
          await fn((t) => say(t));
          await done();
        } catch (e) {
          say(HPTrade.friendly(e), 'bad');
        } finally {
          busy = false;
          render();
        }
      }

      async function connectThen(next) {
        const w = await HPTrade.connect(market.chainId, false);
        if (w) { render(); if (next) next(); }
      }

      function sellForm() {
        const price = el('input', { type: 'text', inputmode: 'decimal', placeholder: '0.01', 'aria-label': 'Price in ETH', autocomplete: 'off' });
        const days = el('select', { 'aria-label': 'Listing length' },
          ...[[1, '1 day'], [3, '3 days'], [7, '7 days'], [30, '30 days'], [90, '90 days'], [180, '180 days']].map(([v, t]) => { const o = el('option', { value: v }, t); if (v === 30) o.selected = true; return o; }));
        const split = el('div', { class: 'split' });
        const submit = el('button', { type: 'submit', class: 'primary' }, 'List for sale');
        const update = () => {
          let wei = null;
          try { if (/^\d*\.?\d+$/.test(price.value.trim())) wei = ethers.parseEther(price.value.trim()); } catch {}
          submit.disabled = !wei || wei <= 0n || busy;
          if (!wei || wei <= 0n) { split.textContent = 'Enter a price in ETH.'; return; }
          const s = HPMarket.split(wei, market.royalty);
          split.textContent = market.royalty
            ? `Buyer pays ${HPTrade.eth(s.price)} · creator royalty ${market.royalty.bps / 100}% (${HPTrade.eth(s.fee)}) · you get ${HPTrade.eth(s.seller)}`
            : `Buyer pays ${HPTrade.eth(s.price)} · you get all of it. No marketplace fee.`;
        };
        price.oninput = update;
        update();
        const form = el('form', { onsubmit: (e) => {
          e.preventDefault();
          const priceWei = ethers.parseEther(price.value.trim());
          act((status) => HPTrade.list(market, { tokenId: token.id, priceWei, days: Number(days.value), onStatus: status }), async () => {
            market = await HPTrade.load(key);
            selling = false;
            say('Listed. Anyone can buy it now.', 'good');
          });
        } },
        el('div', { class: 'two' }, el('label', {}, 'Price (ETH)', price), el('label', {}, 'Listed for', days)),
        split,
        el('div', { class: 'acts' }, submit, el('button', { type: 'button', onclick: () => { selling = false; render(); } }, 'Back')));
        setTimeout(() => price.focus(), 0);
        return form;
      }

      function render() {
        const me = HPTrade.wallet?.address;
        const listing = market.listings.find((l) => l.tokenId === token.id && same(l.seller, owner));
        const mine = same(me, owner);
        const kids = [];
        if (listing) {
          kids.push(el('div', { class: 'row1' }, el('span', { class: 'lbl' }, 'For sale'), el('span', { class: 'price' }, HPTrade.eth(listing.price))));
          kids.push(el('div', { class: 'sub' }, `Listed by ${mine ? 'you' : short(listing.seller)} · until ${ends(listing.endTime)} · settles on Seaport`));
          const acts = el('div', { class: 'acts' });
          if (!me) acts.append(el('button', { type: 'button', class: 'primary', onclick: () => connectThen() }, 'Connect wallet to buy'));
          else if (mine) acts.append(el('button', { type: 'button', onclick: () => act((st) => HPTrade.cancel(market, listing, st), async () => { market = await HPTrade.load(key); say('Listing cancelled.', 'good'); }) }, 'Cancel listing'));
          else acts.append(el('button', { type: 'button', class: 'primary', onclick: () => act((st) => HPTrade.buy(market, listing, st), async () => {
            owner = me;
            market = await HPTrade.load(key).catch(() => market);
            say('Bought. It\'s in your wallet now; the page will catch up in a few seconds.', 'good');
            setTimeout(() => location.reload(), 6000);
          }) }, 'Buy now'));
          for (const b of acts.querySelectorAll('button')) b.disabled = busy;
          kids.push(acts);
        } else {
          kids.push(el('div', { class: 'row1' }, el('span', { class: 'lbl' }, 'Not for sale'), token.lastSale ? el('span', { class: 'sub' }, `Last sale ${HPTrade.eth(token.lastSale.price)}`) : null));
          if (mine && selling) kids.push(sellForm());
          else if (mine) kids.push(el('div', { class: 'acts' }, el('button', { type: 'button', class: 'primary', onclick: () => { selling = true; say(''); render(); } }, 'List for sale')));
          else if (!me) kids.push(el('div', { class: 'acts' }, el('button', { type: 'button', onclick: () => connectThen(() => { if (same(HPTrade.wallet?.address, owner)) { selling = true; render(); } }) }, 'Own this print? Connect to sell')));
        }
        kids.push(msg);
        box.replaceChildren(...kids);
        box.hidden = false;
      }
      render();
    }

    const save = (name, blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    const name = `hashprint-${id || seed.slice(2, 10)}`;
    document.getElementById('svg').onclick = () => save(name + '.svg', new Blob([HP.toSVG(art, 16)], { type: 'image/svg+xml' }));
    document.getElementById('png').onclick = () => {
      const big = document.createElement('canvas');
      big.width = big.height = art.size * 16;
      const g = big.getContext('2d');
      g.imageSmoothingEnabled = false;
      g.drawImage(c, 0, 0, big.width, big.height);
      big.toBlob((b) => save(name + '.png', b));
    };
  })();
</script>
</body>
</html>
