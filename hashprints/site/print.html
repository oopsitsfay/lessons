<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.png">
<title>HashPrint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f4f0e6; --paper-2: #ebe5d6; --ink: #1b1b1b; --muted: #7a7466; --rule: #d6cfbd; --accent: #ff48b0; --gold: #b38b14; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #0b0b10; --paper-2: #13131b; --ink: #f0efec; --muted: #8b8a9c; --rule: #2a2a38; --accent: #c6ff00; --gold: #ffd700; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #0b0b10; --paper-2: #13131b; --ink: #f0efec; --muted: #8b8a9c; --rule: #2a2a38; --accent: #c6ff00; --gold: #ffd700; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 "Space Grotesk", system-ui, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--accent); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; font: 700 16px "JetBrains Mono", monospace; }
  .top span { color: var(--accent); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; gap: 24px; } }
  .frame { background: var(--paper-2); border: 1px solid var(--rule); padding: 14px; }
  canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; }
  h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1; margin: 0 0 8px; letter-spacing: -1px; }
  .sub { color: var(--muted); font: 13px "JetBrains Mono", monospace; word-break: break-all; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font: 13px "JetBrains Mono", monospace; margin-bottom: 24px; }
  th, td { text-align: left; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: 400; width: 40%; }
  td { text-align: right; }
  .gold { color: var(--gold); font-weight: 700; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn { font: 700 13px "JetBrains Mono", monospace; padding: 10px 16px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; }
  button:hover, .btn:hover { background: var(--ink); color: var(--paper); }
  .err { border-left: 4px solid var(--accent); padding: 12px 16px; background: var(--paper-2); }
  .top nav { display: flex; gap: 18px; }
  h2 { font: 700 13px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 6px; }
  td a { text-decoration-color: var(--accent); }
  .hist td:first-child { text-align: left; }
  .trade { border: 2px solid var(--ink); padding: 16px; margin: 0 0 24px; }
  .trade .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .trade .lbl { font: 12px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .trade .price { font: 700 28px "JetBrains Mono", monospace; }
  .trade .sub { font: 12px "JetBrains Mono", monospace; color: var(--muted); margin: 4px 0 14px; word-break: normal; }
  .trade .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .trade .acts button { flex: 1 1 160px; }
  .trade button.primary { background: var(--ink); color: var(--paper); }
  .trade button.primary:hover { background: var(--accent); border-color: var(--accent); color: #000; }
  .trade button:disabled { opacity: .45; cursor: not-allowed; }
  .trade form { margin-top: 14px; display: grid; gap: 10px; }
  .trade label { font: 11px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); display: grid; gap: 6px; }
  .trade input, .trade select { font: 15px "JetBrains Mono", monospace; padding: 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); width: 100%; }
  .trade .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .trade .split { font: 12px "JetBrains Mono", monospace; color: var(--ink-2, var(--muted)); line-height: 1.7; }
  .trade .msg { font: 13px "JetBrains Mono", monospace; margin-top: 12px; min-height: 1.2em; word-break: break-word; }
  .trade .msg.bad { color: #c62828; }
  .trade .msg.good { color: #00835a; }
  .trade .split div { display: flex; justify-content: space-between; }
  .trade .presets, .panel .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .trade button.preset, .panel button.preset { font: 12px "JetBrains Mono", monospace; padding: 6px 10px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; flex: 0 0 auto; }
  .trade button.preset:hover, .panel button.preset:hover { background: var(--accent); border-color: var(--accent); color: #000; }
  .trade .note { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .trade form label { margin-top: 2px; }
  #offers { margin: 0 0 24px; }
  #offers .none { color: var(--muted); font: 13px "JetBrains Mono", monospace; margin: 0; }
  table.offers td, table.offers th { vertical-align: middle; }
  table.offers th { width: auto; }
  table.offers td { text-align: left; }
  table.offers td:last-child { text-align: right; }
  table.offers button { padding: 7px 12px; font-size: 12px; }
  table.offers button.primary { background: var(--ink); color: var(--paper); }
  table.offers .sub { margin: 2px 0 0; font-size: 11px; }
</style>
</head>
